services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: kalpi
      POSTGRES_PASSWORD: kalpi
      POSTGRES_DB: kalpi
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kalpi -d kalpi"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://kalpi:kalpi@db:5432/kalpi
    ports:
      - "${APP_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
