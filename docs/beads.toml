# Beads = frozen plan definition. Mutable status lives in docs/state.json (managed by scripts/beads.py).
# Fields: id, phase, kind(task|gate), priority(P0 must|P1 should|P2 nice), blocked_by[], est(min),
#         model(suggested), what, done_when (measurable), if_fails (scenario id from PLAN.md), reqs (R-IDs), spec (pointer)
# Phases: A foundation+feasibility | B core engine | C broker adapters | D frontend | E hardening+release | S stretch

# ───────────────────────── PHASE A: Foundation + feasibility ─────────────────────────
[[bead]]
id = "A1"
phase = "A"
kind = "task"
priority = "P0"
blocked_by = []
est = 40
model = "sonnet (5 parallel broker-researcher subagents)"
title = "Research the 5 broker APIs from primary docs"
what = "Spawn one broker-researcher subagent per broker (zerodha, upstox, fyers, angelone, groww). Each writes docs/brokers/<id>.md (<=70 lines). Then fill the comparison table in docs/BROKERS.md. Check auth flow, holdings, funds, place order, order status/book, tag field, instrument identifier + master file, rate limits, static IP, MPP, error shapes."
done_when = "5 files exist in docs/brokers/; BROKERS.md table has no empty cell (each cell has a URL or UNVERIFIED); count of UNVERIFIED cells recorded in evidence."
if_fails = "F1"
reqs = ["R1", "R2"]
spec = "SPEC §4, DECISIONS D1/D13"

